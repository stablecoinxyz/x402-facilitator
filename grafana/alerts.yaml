# Grafana Alert Rules for x402 Facilitator
#
# Import manually via Grafana UI:
#   Alerts & IRM → Alert rules → + New alert rule
#
# These are reference definitions — copy the PromQL expressions into the Grafana alert rule builder.
#
# Settle result labels, split by whose fault the outcome is.
# This split is what the alerts key off — do not add a label without placing it.
#
#   OK              success, replay
#
#   CLIENT FAULT    bad_request, expired, invalid_signature, failed
#                   The facilitator behaved correctly and rejected bad input.
#                   These must NEVER page. A public endpoint gets scanned; on
#                   2026-08-26 a bot posting from 0x...0001 produced a run of
#                   these on its own.
#
#   FACILITATOR     rpc_error, receipt_timeout, nonce_conflict, gas_error,
#   FAULT           insufficient_allowance, tx_reverted, unknown
#                   Something on our side broke. At current volume a single
#                   occurrence is worth knowing about.

rules:
  # REPLACES "Settle failure rate high", which was deleted rather than tuned.
  #
  # That rule was a ratio with no minimum-volume floor, and it counted client
  # errors as facilitator failures. At ~0.7 settles/hour a 5m window holds 0 or 1
  # settle, so one scanner request read as 100% failure and paged. No floor value
  # fixes it: a floor high enough to be meaningful (n>=20, roughly 30h of traffic
  # at current volume) means the rule never evaluates, and a floor low enough to
  # evaluate filters nothing.
  #
  # Counting absolutely instead of proportionally is what makes this work at low
  # volume — one real fault is worth a page, and no amount of junk input is.
  - name: Settle faults on our side
    condition: >
      sum(increase(x402_settle_total{result=~"rpc_error|receipt_timeout|nonce_conflict|gas_error|insufficient_allowance|tx_reverted|unknown"}[15m])) >= 2
    for: 0m
    severity: critical
    summary: "2+ facilitator-fault settle errors in 15 minutes"
    action: "Check Loki: {app=\"sbc-x402-facilitator\"} | json | action=\"settle\" | errorCategory!=\"\""

  # The alert that would have caught the x402 v1 outage. Between 2026-02-20 and
  # 2026-08-07 the facilitator rejected every spec-conformant v1 client with
  # invalid_network, and nothing fired, because "no successful payments, ever" is
  # invisible to a rule that only measures error ratios.
  #
  # Keyed on verify rather than settle: verify carries ~11x the volume, so it has
  # enough traffic to measure. The `or vector(0)` is load-bearing — if no request
  # has ever produced result="valid" that series does not exist, sum() over an
  # empty vector returns empty rather than 0, `== 0` matches nothing, and the
  # alert silently never fires. Which is exactly the outage it exists to detect.
  - name: Traffic arriving but nothing succeeding
    condition: >
      (sum(increase(x402_verify_total[6h])) >= 5)
      and
      ((sum(increase(x402_verify_total{result="valid"}[6h])) or vector(0)) == 0)
    for: 10m
    severity: critical
    summary: "Verify requests arriving for 6h with zero valid results"
    action: "Payments are reaching us and none are succeeding. Check Loki for the dominant invalidReason: {app=\"sbc-x402-facilitator\"} | json | action=\"verify\""

  # Client-fault volume is tracked, never paged. A spike here means an integrator
  # shipped something broken, or a scanner found the endpoint — worth seeing on the
  # dashboard, never worth waking anyone.
  - name: Client error volume elevated (dashboard only)
    condition: >
      sum(increase(x402_settle_total{result=~"bad_request|expired|invalid_signature|failed"}[1h])) > 20
    for: 0m
    severity: info
    summary: "High volume of client-side settle rejections in the last hour"
    action: "Informational. Identify the payer: {app=\"sbc-x402-facilitator\"} | json | action=\"settle\" | line_format \"{{.payer}} {{.errorReason}}\""

  - name: RPC errors spiking
    condition: >
      sum(increase(x402_settle_total{result="rpc_error"}[5m])) > 3
    for: 0m
    severity: critical
    summary: "Multiple RPC connection failures in 5 minutes"
    action: "Check RPC provider status for affected network"

  - name: Nonce conflicts detected
    condition: >
      sum(increase(x402_settle_total{result="nonce_conflict"}[5m])) > 0
    for: 0m
    severity: warning
    summary: "Transaction nonce conflicts — possible concurrent settle race"
    action: "Check if multiple facilitator instances are using the same wallet"

  # Client fault: downgraded from warning to info, and from "any occurrence" to a
  # volume threshold. The facilitator proactively refuses permits with under 30s
  # left to avoid burning gas, so a client with short deadlines produces a steady
  # drip of these while the facilitator is working exactly as designed.
  - name: Permit expired attempts (dashboard only)
    condition: >
      sum(increase(x402_settle_total{result="expired"}[1h])) > 10
    for: 0m
    severity: info
    summary: "Repeated expired-permit settle attempts in the last hour"
    action: "Informational. Likely an SDK client using too-short permit durations"

  # Client fault: downgraded from warning to info. This label is now where the
  # malformed-signature guard routes junk, so any scanner hitting the public
  # endpoint will trip a 5m/>3 threshold — the previous rule would have paged on
  # the 2026-08-26 bot traffic by itself.
  - name: Signature errors elevated (dashboard only)
    condition: >
      sum(increase(x402_settle_total{result="invalid_signature"}[1h])) > 20
    for: 0m
    severity: info
    summary: "High volume of invalid permit signatures in the last hour"
    action: "Informational. Identify the payer before assuming a real integrator is broken"

  - name: Health check down
    type: loki
    condition: >
      absent_over_time(
        {app="sbc-x402-facilitator"} | json | msg="Facilitator started" [10m]
      )
    for: 5m
    severity: critical
    summary: "No facilitator logs received in 10 minutes"
    action: "Check fly status -a sbc-x402-facilitator"
